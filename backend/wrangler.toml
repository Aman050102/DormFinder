name = "dorm-finder-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# ============================================================
# D1 Database — Cloudflare serverless SQLite
# ============================================================
# 1. npx wrangler d1 create dorm-finder-db
# 2. เอา database_id มาใส่ด้านล่าง
# 3. npm run migrate:local (dev) หรือ migrate:remote (production)
# ============================================================

[[d1_databases]]
binding = "DB"
database_name = "dorm-finder-db"
database_id = ""          # ← ใส่ database_id หลังจากสร้าง
migrations_dir = "migrations"
