<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorm Finder — เข้าสู่ระบบ</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="#" type="image/png" sizes="16x16">
</head>
<body>
  <div class="auth-container">
    <section class="auth-left">
      <div class="brand">
        <div class="brand-illustration">🏠</div>
        <h1>Dorm Finder</h1>
        <p>ค้นหาหอพักที่ใช่สำหรับคุณ<br>ระบบจัดการหอพักอัจฉริยะ</p>
        <span class="tagline">Find Your Home 🏡</span>
      </div>
    </section>
    <section class="auth-right">
      <div class="form-wrapper">
        <h2>เข้าสู่ระบบ</h2>
        <p class="form-subtitle">ยินดีต้อนรับกลับ! กรุณาเข้าสู่ระบบเพื่อดำเนินการต่อ</p>

        <div class="role-toggle" role="group" aria-label="เลือกประเภทผู้ใช้">
          <button class="role-btn active" data-role="user" aria-pressed="true">
            <i class="fas fa-user"></i> ผู้ใช้
          </button>
          <button class="role-btn" data-role="admin" aria-pressed="false">
            <i class="fas fa-shield-alt"></i> ผู้ดูแลระบบ
          </button>
        </div>

        <div id="roleIndicator" class="role-indicator user">
          <i class="fas fa-user"></i> กำลังเข้าสู่ระบบในฐานะ ผู้ใช้
        </div>

        <div id="alertMessage" class="alert" role="alert">
          <i class="fas fa-exclamation-circle"></i>
          <span id="alertText"></span>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="loginEmail">อีเมล</label>
            <div class="input-group">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email" required>
            </div>
          </div>
          <div class="form-group">
            <label for="loginPassword">รหัสผ่าน</label>
            <div class="input-group">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="loginPassword" placeholder="รหัสผ่านของคุณ" autocomplete="current-password" required>
              <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="แสดง/ซ่อนรหัสผ่าน">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-footer">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe"> จดจำฉันไว้
            </label>
            <a href="#" class="forgot-link">ลืมรหัสผ่าน?</a>
          </div>
          <div class="btn-group">
            <button type="button" class="btn btn-ghost" onclick="goToRegister()">
              <i class="fas fa-user-plus"></i> สมัครสมาชิก
            </button>
            <button type="submit" class="btn btn-dark" id="loginSubmitBtn">
              <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
            </button>
          </div>
        </form>

        <div class="form-switch">
          ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิกทันที</a>
        </div>
      </div>
    </section>
  </div>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
