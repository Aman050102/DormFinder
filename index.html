<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorm Finder — เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🏠</text></svg>" type="image/svg+xml">
</head>
<body>

<div class="auth-container">
  <!-- Left: Brand -->
  <section class="auth-left">
    <div class="brand">
      <div class="brand-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <polyline points="9 21 9 13 15 13 15 21"/>
        </svg>
      </div>
      <h1>Dorm Finder</h1>
      <p>ระบบจัดการหอพักอัจฉริยะ<br>ค้นหา จอง และบริหารหอพักของคุณ</p>
      <span class="tagline">ระบบจัดการหอพัก</span>
    </div>
  </section>

  <!-- Right: Login Form -->
  <section class="auth-right">
    <div class="form-wrapper">
      <h2>เข้าสู่ระบบ</h2>
      <p class="form-subtitle">ยินดีต้อนรับกลับ กรุณาเลือกบทบาทและเข้าสู่ระบบ</p>

      <!-- Role Toggle -->
      <div class="role-toggle" role="group" aria-label="เลือกประเภทผู้ใช้">
        <button class="role-btn active" data-role="user" aria-pressed="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          ผู้ใช้ทั่วไป
        </button>
        <button class="role-btn" data-role="admin" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
          ผู้ดูแลระบบ
        </button>
      </div>

      <div id="roleIndicator" class="role-indicator user">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        เข้าสู่ระบบในฐานะ ผู้ใช้ทั่วไป
      </div>

      <div id="alertMessage" class="alert" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="alertText"></span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">อีเมล</label>
          <div class="input-group">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">รหัสผ่าน</label>
          <div class="input-group">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="loginPassword" placeholder="รหัสผ่านของคุณ" autocomplete="current-password" required>
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="แสดง/ซ่อนรหัสผ่าน">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-footer">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe"> จดจำฉัน
          </label>
          <a href="#" class="forgot-link">ลืมรหัสผ่าน?</a>
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-ghost" onclick="goToRegister()">สมัครสมาชิก</button>
          <button type="submit" class="btn btn-dark" id="loginSubmitBtn">เข้าสู่ระบบ</button>
        </div>
      </form>

      <div class="form-switch">
        ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a>
      </div>
    </div>
  </section>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
