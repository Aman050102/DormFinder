<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorm Finder — ผู้ใช้</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:Inter,-apple-system,'Segoe UI',sans-serif; background:#F7F5F2; color:#1C1C1E; min-height:100vh; display:flex; flex-direction:column; text-rendering:optimizeLegibility; }
    header { background:#1C1C1E; color:white; padding:18px 28px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { font-size:1.15rem; display:flex; align-items:center; gap:10px; font-weight:600; }
    header svg { color:#4E9370; }
    .badge { background:#4E9370; color:white; padding:5px 14px; border-radius:20px; font-size:0.8rem; font-weight:600; display:flex; align-items:center; gap:6px; }
    .badge svg { color:white; width:14px; height:14px; }
    .container { max-width:min(800px,92vw); margin:clamp(24px,5vh,60px) auto; padding:clamp(24px,4vw,40px); background:white; border-radius:16px; box-shadow:0 2px 16px rgba(0,0,0,0.04); text-align:center; }
    .big-icon { display:flex; justify-content:center; }
    .big-icon svg { width:48px; height:48px; color:#4E9370; margin-bottom:12px; }
    .container h2 { font-size:clamp(1.2rem,2vw,1.5rem); font-weight:700; margin-bottom:8px; }
    .container p { color:#6B7280; margin-bottom:24px; line-height:1.6; font-size:0.92rem; }
    .stats { display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin-bottom:28px; }
    .stat-card { background:#F7F5F2; padding:16px 24px; border-radius:12px; text-align:center; min-width:130px; flex:1; max-width:180px; }
    .stat-card svg { width:24px; height:24px; color:#4E9370; margin-bottom:6px; }
    .stat-card .num { font-size:1.35rem; font-weight:800; }
    .stat-card .label { font-size:0.75rem; color:#9CA3AF; }
    .btn { display:inline-flex; align-items:center; gap:7px; padding:11px 28px; background:#DC2626; color:white; border:none; border-radius:8px; font-size:0.88rem; font-weight:600; cursor:pointer; transition:all 0.15s; font-family:inherit; }
    .btn:hover { background:#B91C1C; box-shadow:0 2px 8px rgba(220,38,38,0.15); }
    @media (max-width:600px) { header { padding:14px 16px; } header h1 { font-size:1rem; } .container { margin:16px; } }
  </style>
</head>
<body>
  <header>
    <h1>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <polyline points="9 21 9 13 15 13 15 21"/>
      </svg>
      Dorm Finder
    </h1>
    <span class="badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      ผู้ใช้ทั่วไป
    </span>
  </header>
  <div class="container">
    <div class="big-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4E9370" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
    </div>
    <h2>ยินดีต้อนรับ</h2>
    <p>คุณเข้าสู่ระบบในฐานะ <strong>ผู้ใช้ทั่วไป</strong><br>เลือกดูหอพักหรือจัดการโปรไฟล์ของคุณ</p>
    <div class="stats">
      <div class="stat-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><polyline points="9 21 9 13 15 13 15 21"/></svg>
        <div class="num">0</div>
        <div class="label">หอพักที่บันทึก</div>
      </div>
      <div class="stat-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <div class="num">0</div>
        <div class="label">หอพักที่ถูกใจ</div>
      </div>
      <div class="stat-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <div class="num">—</div>
        <div class="label">รีวิว</div>
      </div>
    </div>
    <button class="btn" onclick="handleLogout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      ออกจากระบบ
    </button>
  </div>
  <script src="../../assets/js/api.js"></script>
  <script>
    async function handleLogout() { await API.logout(); window.location.href = '../../index.html'; }
    (function() { const s = JSON.parse(localStorage.getItem('dormFinderSession')); if (!s || s.role !== 'user') window.location.href = '../../index.html'; })();
  </script>
</body>
</html>
