<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorm Finder — สมัครสมาชิก</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🏠</text></svg>" type="image/svg+xml">
</head>
<body>

<div class="auth-container">
  <section class="auth-left">
    <div class="brand">
      <div class="brand-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <polyline points="9 21 9 13 15 13 15 21"/>
        </svg>
      </div>
      <h1>Dorm Finder</h1>
      <p>สมัครสมาชิกเพื่อเริ่มต้น<br>ค้นหาหอพักที่ใช่สำหรับคุณ</p>
      <span class="tagline">เริ่มต้นใช้งาน</span>
    </div>
  </section>

  <section class="auth-right">
    <div class="form-wrapper scrollable">
      <div class="auth-header">
        <h2>สร้างบัญชีผู้ใช้</h2>
        <p class="form-subtitle">กรอกข้อมูลให้ครบถ้วนเพื่อสมัครสมาชิก</p>
      </div>

      <div id="alertMessage" class="alert" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="alertText"></span>
      </div>

      <form id="registerForm" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="regUsername">ชื่อผู้ใช้</label>
            <div class="input-group">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="regUsername" placeholder="Username" autocomplete="username" required>
            </div>
          </div>
          <div class="form-group">
            <label for="regEmail">อีเมล</label>
            <div class="input-group">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="regEmail" placeholder="your@email.com" autocomplete="email" required>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="regPassword">รหัสผ่าน</label>
            <div class="input-group">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="regPassword" placeholder="อย่างน้อย 8 ตัวอักษร" autocomplete="new-password" required>
              <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('regPassword', this)" aria-label="แสดง/ซ่อนรหัสผ่าน">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="regConfirmPassword">ยืนยันรหัสผ่าน</label>
            <div class="input-group">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              <input type="password" id="regConfirmPassword" placeholder="ยืนยันรหัสผ่าน" autocomplete="new-password" required>
              <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('regConfirmPassword', this)" aria-label="แสดง/ซ่อนรหัสผ่าน">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="regPhone">เบอร์โทรศัพท์</label>
            <div class="input-group">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.36 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.34 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <input type="tel" id="regPhone" placeholder="0812345678" pattern="[0-9]{10}" required>
            </div>
          </div>
          <div class="form-group">
            <label for="regDob">วันเกิด</label>
            <div class="input-group no-icon">
              <input type="date" id="regDob" required>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>เพศ</label>
          <div class="gender-group">
            <label class="gender-option"><input type="radio" name="gender" value="male" required> ชาย</label>
            <label class="gender-option"><input type="radio" name="gender" value="female"> หญิง</label>
            <label class="gender-option"><input type="radio" name="gender" value="other"> อื่น ๆ</label>
          </div>
        </div>

        <div class="section-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          ที่อยู่
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="regStreet">บ้านเลขที่ / ถนน</label>
            <div class="input-group no-icon">
              <input type="text" id="regStreet" placeholder="123/4 ถ.สุขุมวิท" required>
            </div>
          </div>
          <div class="form-group">
            <label for="regAlley">ตรอก / ซอย</label>
            <div class="input-group no-icon">
              <input type="text" id="regAlley" placeholder="ซอย 5">
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="regSubdistrict">แขวง / ตำบล</label>
            <div class="input-group no-icon">
              <input type="text" id="regSubdistrict" placeholder="ตำบล" required>
            </div>
          </div>
          <div class="form-group">
            <label for="regDistrict">เขต / อำเภอ</label>
            <div class="input-group no-icon">
              <input type="text" id="regDistrict" placeholder="อำเภอ" required>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="regProvince">จังหวัด</label>
            <div class="input-group no-icon">
              <input type="text" id="regProvince" placeholder="จังหวัด" required>
            </div>
          </div>
          <div class="form-group">
            <label for="regPostalCode">รหัสไปรษณีย์</label>
            <div class="input-group no-icon">
              <input type="text" id="regPostalCode" placeholder="10110" pattern="[0-9]{5}" required>
            </div>
          </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="termsCheckbox" required>
          <label for="termsCheckbox">
            โดยการสมัครสมาชิก คุณยอมรับ
            <a href="#">ข้อกำหนดและเงื่อนไข</a> และ
            <a href="#">นโยบายความเป็นส่วนตัว</a>
          </label>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-dark btn-full" id="registerSubmitBtn">สมัครสมาชิก</button>
        </div>
      </form>

      <div class="form-switch">
        มีบัญชีอยู่แล้ว? <a href="index.html">เข้าสู่ระบบ</a>
      </div>
    </div>
  </section>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/register.js"></script>
</body>
</html>
